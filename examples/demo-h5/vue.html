<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>whistle-vconsole vue demo</title>
  <style>
    body { font-family: -apple-system, sans-serif; margin: 0; padding: 16px; background: #f5f5f7; }
    h1 { font-size: 20px; }
    li { margin: 6px 0; }
    button { padding: 10px 14px; font-size: 14px; border: none; border-radius: 8px; background: #42b883; color: #fff; margin-right: 8px; }
    a { font-size: 13px; color: #4e5969; }
  </style>
</head>
<body>
  <div id="app"></div>
  <p><a href="/">← 返回 vanilla demo</a></p>

  <script src="/vue.global.js"></script>
  <script src="/vuex4.global.prod.js"></script>
  <script src="/vconsole.min.js"></script>
  <script>
    var qs = new URLSearchParams(location.search);
    new VConsole({
      serverUrl: qs.get('ws') || 'ws://' + location.hostname + ':9528',
    });

    // 选项式组件：data + props，状态走 instance.data
    var todoItem = {
      name: 'TodoItem',
      props: ['item'],
      data: function () {
        return { done: this.item.done };
      },
      template: '<li @click="done = !done">{{ item.title }} — {{ done ? "已完成" : "进行中" }}</li>',
    };

    // 组合式组件：setup 状态，走 instance.setupState
    var todoList = {
      name: 'TodoList',
      components: { 'todo-item': todoItem },
      props: { title: String, initial: Array },
      setup: function (props) {
        var items = Vue.ref(props.initial.slice());
        var addOne = function () {
          items.value.push({ title: '任务 ' + (items.value.length + 1), done: false });
          console.log('[vue] added task', { count: items.value.length });
        };
        var doneCount = Vue.computed(function () {
          return items.value.filter(function (it) { return it.done; }).length;
        });
        return { items: items, addOne: addOne, doneCount: doneCount };
      },
      template:
        '<div><h3>{{ title }}</h3><ul><todo-item v-for="(it, i) in items" :key="i" :item="it"></todo-item></ul>' +
        '<p>已完成 {{ doneCount }} 项 · <button @click="$store.commit(\'bump\')">{{ $store.getters.label }}</button></p></div>',
    };

    var store = Vuex.createStore({
      state: function () {
        return { serverName: '演示环境 A', calls: 0 };
      },
      getters: {
        label: function (state) {
          return state.serverName + ' · ' + state.calls + ' 次调用';
        },
      },
      mutations: {
        bump: function (state) {
          state.calls++;
        },
      },
    });

    Vue.createApp({
      name: 'VueDemoApp',
      components: { 'todo-list': todoList },
      data: function () {
        return { appTitle: 'Vue 调试演示页', loadTime: new Date().toLocaleTimeString() };
      },
      template:
        '<div><h1>{{ appTitle }}</h1><p>页面加载于 {{ loadTime }}</p>' +
        '<todo-list title="今日待办" :initial="[{ title: \'接入手探针\', done: true }, { title: \'看组件状态\', done: false }]"></todo-list></div>',
    }).use(store).mount('#app');
  </script>
</body>
</html>
